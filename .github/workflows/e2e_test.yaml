name: E2E tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e_tests:
    strategy:
      matrix:
        # ref: https://github.com/actions/runner-images
        os: [ubuntu-latest, macos-latest, windows-latest]
        lua_version: [5.5.0, 5.4.7, 5.3.6]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vfox

      - name: install readline lib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libreadline-dev -y

      - name: install readline lib (MacOS)
        if: runner.os == 'MacOS'
        run: |
          brew install readline

      - name: Install and run the requested Lua version (Unix)
        if: runner.os != 'Windows'
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          vfox install "lua@$LUA_VERSION"
          vfox exec "lua@$LUA_VERSION" -- lua -v | grep -F "$LUA_VERSION"

      - name: The installed Lua passes its Busted E2E specifications (Unix)
        if: runner.os != 'Windows'
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          vfox exec "lua@$LUA_VERSION" -- luarocks install busted
          vfox exec "lua@$LUA_VERSION" -- busted --verbose spec/e2e

      - name: Default LuaRocks installs and lists luacheck (Unix)
        if: runner.os != 'Windows' && matrix.lua_version == '5.4.7'
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          vfox exec "lua@$LUA_VERSION" -- luarocks --version
          vfox exec "lua@$LUA_VERSION" -- luarocks install luacheck
          vfox exec "lua@$LUA_VERSION" -- luarocks list | grep luacheck

      - name: Install and run the latest Lua release (Linux)
        if: runner.os == 'Linux' && matrix.lua_version == '5.5.0'
        run: |
          vfox install lua@latest
          LATEST_VERSION=$(vfox list lua | sed -n 's/.*\(5\.[0-9]*\.[0-9]*\).*/\1/p' | sort -V | tail -1)
          vfox exec "lua@$LATEST_VERSION" -- lua -v | grep '^Lua [0-9]'

      - name: Project selection resolves Lua for exec without an explicit version
        if: runner.os != 'Windows' && matrix.lua_version == '5.4.7'
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          eval "$(vfox activate bash)"
          vfox use -p "lua@$LUA_VERSION"
          vfox exec lua -- lua -v | grep -F "$LUA_VERSION"

      - name: Verify Lua static library supports shared modules (Unix)
        if: runner.os != 'Windows'
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          LUA_PACKAGE=$(vfox info "lua@$LUA_VERSION")
          LUA_PREFIX="$LUA_PACKAGE/lua-$LUA_VERSION"
          if [ "${{ runner.os }}" = "Linux" ]; then
            gcc -shared -o /dev/null -Wl,--whole-archive "$LUA_PREFIX/lib/liblua.a" -Wl,--no-whole-archive -lm -ldl
          else
            cc -dynamiclib -o /dev/null -Wl,-force_load,"$LUA_PREFIX/lib/liblua.a" -lm
          fi

      - name: Setup MSYS2 (Windows)
        uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Add Windows build tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install and run the requested Lua version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          vfox install "lua@$env:LUA_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = vfox exec "lua@$env:LUA_VERSION" -- lua.exe -v
          if ($LASTEXITCODE -ne 0 -or $result -notmatch "Lua $([regex]::Escape($env:LUA_VERSION))") {
            throw "Unexpected Lua version: $result"
          }

  mise_luarocks_tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        lua_version: [5.4.7]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install readline lib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libreadline-dev -y

      - name: install readline lib (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install readline

      - name: install Lua with default LuaRocks integration via mise
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
          PLUGIN_REF: ${{ github.head_ref || github.sha }}
        run: |
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"

          # Pin the plugin to this PR's ref so mise tests the branch under review,
          # not whatever is on the default branch.
          PLUGIN_NAME="vfox-$(echo '${{ github.repository }}' | tr '/' '-')"
          $HOME/.local/bin/mise plugins install --force "$PLUGIN_NAME" "https://github.com/${{ github.repository }}.git#${PLUGIN_REF}"

          $HOME/.local/bin/mise use -g "vfox:${{ github.repository }}@$LUA_VERSION"

          echo "=== Verify Lua ==="
          $HOME/.local/bin/mise exec -- lua -v | grep $LUA_VERSION

          echo "=== Verify LuaRocks ==="
          $HOME/.local/bin/mise exec -- luarocks --version
          $HOME/.local/bin/mise exec -- luarocks install luacheck
          $HOME/.local/bin/mise exec -- luarocks list | grep luacheck

      - name: Lua installed through mise passes its Busted E2E specifications
        env:
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise exec -- luarocks install busted
          mise exec -- busted --verbose spec/e2e

  luarocks_optout_tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        opt_out_value: ["0", "false"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vfox

      - name: install readline lib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libreadline-dev -y

      - name: install readline lib (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install readline

      - name: install Lua with LuaRocks opt-out
        env:
          LUA_VERSION: 5.4.7
          VFOX_LUA_LUAROCKS: ${{ matrix.opt_out_value }}
        run: |
          vfox install lua@$LUA_VERSION

          echo "=== Verify Lua is installed ==="
          vfox exec "lua@$LUA_VERSION" -- lua -v | grep -F "$LUA_VERSION"

          echo "=== Verify LuaRocks is NOT installed (VFOX_LUA_LUAROCKS=$VFOX_LUA_LUAROCKS) ==="
          if vfox exec "lua@$LUA_VERSION" -- sh -c 'command -v luarocks' >/dev/null 2>&1; then
            echo "FAIL: luarocks should NOT be on PATH when VFOX_LUA_LUAROCKS=$VFOX_LUA_LUAROCKS"
            vfox exec "lua@$LUA_VERSION" -- sh -c 'command -v luarocks'
            exit 1
          fi

          LUA_PACKAGE=$(vfox info "lua@$LUA_VERSION")
          LUA_PREFIX="$LUA_PACKAGE/lua-$LUA_VERSION"
          if [ -d "$LUA_PREFIX/luarocks" ]; then
            echo "FAIL: $LUA_PREFIX/luarocks should not exist when opted out"
            exit 1
          fi
          echo "OK: LuaRocks was correctly skipped"

  windows_luabinaries_tests:
    strategy:
      matrix:
        lua_version: [5.5.0, 5.4.8, 5.3.6]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vfox

      - name: install Lua from LuaBinaries by vfox-lua plugin
        shell: pwsh
        env:
          LUA_VERSION: "${{ matrix.lua_version }}"
          VFOX_LUA_WINDOWS_LUABINARIES: "1"
        run: |
          vfox install "lua@$env:LUA_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $luaVersion = vfox exec "lua@$env:LUA_VERSION" -- lua.exe -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $luacVersion = vfox exec "lua@$env:LUA_VERSION" -- luac.exe -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($luaVersion -notmatch "Lua $env:LUA_VERSION") {
              Write-Output "lua@$env:LUA_VERSION installed from LuaBinaries failed!"
              exit 1
          }
          if ($luacVersion -notmatch "Lua $env:LUA_VERSION") {
              Write-Output "luac@$env:LUA_VERSION installed from LuaBinaries failed!"
              exit 1
          }
